<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер витрат</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Трекер витрат</h1>
        <nav class="nav" aria-label="Розділи сторінки">
            <a href="#balance-section">Баланс</a>
            <a href="#add-operation">Додати</a>
            <a href="#operations">Операції</a>
        </nav>
    </header>

    <div class="layout">
        <aside id="balance-section" class="balance balance--ok">
            <h2>Баланс</h2>
            <p class="balance__total" id="balance">1820 грн</p>
            <p class="balance__status" id="balance-status">✓ Бюджет у нормі</p>
            <div class="budget-bar" role="img" aria-label="Витрачено доходу">
                <div class="budget-bar__fill" id="budget-fill"></div>
            </div>
            <p class="balance__hint" id="balance-hint">Витрачено 9 % доходу</p>
            <dl class="balance__details">
                <div>
                    <dt>Доходи</dt>
                    <dd class="amount amount--income" id="income-total">+2000 грн</dd>
                </div>
                <div>
                    <dt>Витрати</dt>
                    <dd class="amount amount--expense" id="expense-total">-180 грн</dd>
                </div>
            </dl>
        </aside>

        <main>
            <section id="add-operation" class="section">
                <h2>Додати операцію</h2>
                <form class="form">
                    <div class="form-field">
                        <label for="type">Тип</label>
                        <select id="type" name="type">
                            <option value="expense">Витрата</option>
                            <option value="income">Дохід</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label for="amount">Сума, грн</label>
                            <input type="number" id="amount" name="amount" min="0" step="0.01" required>
                        </div>
                        <div class="form-field">
                            <label for="category">Категорія</label>
                            <select id="category" name="category">
                                <option>Їжа</option>
                                <option>Транспорт</option>
                                <option>Розваги</option>
                                <option>Стипендія</option>
                                <option>Інше</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="date">Дата</label>
                            <input type="date" id="date" name="date" required>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="comment">Коментар</label>
                        <input type="text" id="comment" name="comment">
                    </div>

                    <button type="submit" class="btn">Додати</button>
                </form>
            </section>

            <section id="operations" class="section">
                <h2>Операції</h2>
                <ul class="operations-list" id="transactions-list">
                    <li class="operation static-example">-150 грн (витрата)</li>
                    <li class="operation static-example">-30 грн (витрата)</li>
                    <li class="operation static-example">+2000 грн (дохід)</li>
                </ul>
            </section>
        </main>
    </div>

    <footer class="site-footer">
        <p>© 2026 Немировський Тимур, ІП-52</p>
    </footer>
</body>
</html>
